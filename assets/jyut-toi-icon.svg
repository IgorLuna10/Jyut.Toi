<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Physical Mounted Sign Shadow (Tsuen Wan Acrylic/Metal Lettering) -->
    <filter id="extrudedSign" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="0" flood-color="#2B0507" flood-opacity="1" />
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <!-- Overhead Platform Lighting & Ceramic Glaze Sheen -->
    <linearGradient id="platformSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="28%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18" />
    </linearGradient>

    <!-- Individual Tile Bevel Highlight -->
    <linearGradient id="tileBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15" />
    </linearGradient>

    <!-- Base Ceramic Tile (116x116 with 12px grout spacing) -->
    <g id="tile">
      <rect width="116" height="116" rx="7" />
      <rect width="116" height="116" rx="7" fill="url(#tileBevel)" />
    </g>
  </defs>

  <!-- Deep Crimson-Charcoal Grout / Mortar Base -->
  <rect width="1024" height="1024" fill="#36080B" />

  <!-- 8x8 Tsuen Wan Red Glazed Mosaic Grid -->
  <g transform="translate(8, 8)">
    <!-- Row 0 -->
    <use href="#tile" x="0" y="0" fill="#B81D24" /><use href="#tile" x="128" y="0" fill="#9E141A" /><use href="#tile" x="256" y="0" fill="#C6222A" /><use href="#tile" x="384" y="0" fill="#AD1920" /><use href="#tile" x="512" y="0" fill="#C22028" /><use href="#tile" x="640" y="0" fill="#961217" /><use href="#tile" x="768" y="0" fill="#B51C23" /><use href="#tile" x="896" y="0" fill="#A6171E" />
    <!-- Row 1 (Upper Platform Light Reflection Zone) -->
    <use href="#tile" x="0" y="128" fill="#C9252D" /><use href="#tile" x="128" y="128" fill="#D42C35" /><use href="#tile" x="256" y="128" fill="#B81D24" /><use href="#tile" x="384" y="128" fill="#CF2830" /><use href="#tile" x="512" y="128" fill="#B01A21" /><use href="#tile" x="640" y="128" fill="#D12A32" /><use href="#tile" x="768" y="128" fill="#C42129" /><use href="#tile" x="896" y="128" fill="#B81D24" />
    <!-- Row 2 -->
    <use href="#tile" x="0" y="256" fill="#A8171E" /><use href="#tile" x="128" y="256" fill="#C22028" /><use href="#tile" x="256" y="256" fill="#CC262E" /><use href="#tile" x="384" y="256" fill="#A1151B" /><use href="#tile" x="512" y="256" fill="#C7232B" /><use href="#tile" x="640" y="256" fill="#B51C23" /><use href="#tile" x="768" y="256" fill="#9E141A" /><use href="#tile" x="896" y="256" fill="#C42129" />
    <!-- Row 3 -->
    <use href="#tile" x="0" y="384" fill="#C22028" /><use href="#tile" x="128" y="384" fill="#9B1319" /><use href="#tile" x="256" y="384" fill="#B51C23" /><use href="#tile" x="384" y="384" fill="#C7232B" /><use href="#tile" x="512" y="384" fill="#9E141A" /><use href="#tile" x="640" y="384" fill="#C22028" /><use href="#tile" x="768" y="384" fill="#B81D24" /><use href="#tile" x="896" y="384" fill="#A3161C" />
    <!-- Row 4 -->
    <use href="#tile" x="0" y="512" fill="#9E141A" /><use href="#tile" x="128" y="512" fill="#B81D24" /><use href="#tile" x="256" y="512" fill="#A3161C" /><use href="#tile" x="384" y="512" fill="#B51C23" /><use href="#tile" x="512" y="512" fill="#C42129" /><use href="#tile" x="640" y="512" fill="#991318" /><use href="#tile" x="768" y="512" fill="#C7232B" /><use href="#tile" x="896" y="512" fill="#B21B22" />
    <!-- Row 5 -->
    <use href="#tile" x="0" y="640" fill="#B51C23" /><use href="#tile" x="128" y="640" fill="#C7232B" /><use href="#tile" x="256" y="640" fill="#991318" /><use href="#tile" x="384" y="640" fill="#C22028" /><use href="#tile" x="512" y="640" fill="#A8171E" /><use href="#tile" x="640" y="640" fill="#BA1E25" /><use href="#tile" x="768" y="640" fill="#9E141A" /><use href="#tile" x="896" y="640" fill="#C42129" />
    <!-- Row 6 -->
    <use href="#tile" x="0" y="768" fill="#A6171E" /><use href="#tile" x="128" y="768" fill="#961217" /><use href="#tile" x="256" y="768" fill="#BD1F26" /><use href="#tile" x="384" y="768" fill="#A1151B" /><use href="#tile" x="512" y="768" fill="#BF2027" /><use href="#tile" x="640" y="768" fill="#8F1015" /><use href="#tile" x="768" y="768" fill="#B51C23" /><use href="#tile" x="896" y="768" fill="#9E141A" />
    <!-- Row 7 -->
    <use href="#tile" x="0" y="896" fill="#941116" /><use href="#tile" x="128" y="896" fill="#B21B22" /><use href="#tile" x="256" y="896" fill="#9E141A" /><use href="#tile" x="384" y="896" fill="#BA1E25" /><use href="#tile" x="512" y="896" fill="#911015" /><use href="#tile" x="640" y="896" fill="#B01A21" /><use href="#tile" x="768" y="896" fill="#9B1319" /><use href="#tile" x="896" y="896" fill="#AD1920" />
  </g>

  <!-- Overhead Station Light Sheen Overlay -->
  <rect width="1024" height="1024" fill="url(#platformSheen)" pointer-events="none" />

  <!-- Centered MTR Tsuen Wan Station Wall Signage: 粵台 / Jyut.Toi -->
  <g filter="url(#extrudedSign)">
    <!-- Traditional Chinese MTR Ming/Song Serif Characters -->
    <text x="512" y="535" font-family="&#39;Noto Serif HK&#39;, &#39;Songti TC&#39;, &#39;PMingLiU&#39;, &#39;STSong&#39;, serif" font-weight="900" font-size="355" fill="#FAF6F0" text-anchor="middle" letter-spacing="16">粵台</text>

    <!-- Neo-Grotesque Wayfinding Romanization -->
    <text x="512" y="720" font-family="&#39;Inter&#39;, &#39;Helvetica Neue&#39;, &#39;DIN Alternate&#39;, Arial, sans-serif" font-weight="800" font-size="134" fill="#FAF6F0" text-anchor="middle" letter-spacing="-1">Jyut.Toi</text>
  </g>
</svg>